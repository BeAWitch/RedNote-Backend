server:
  port: 8080
rednote:
  auth:
    excludePaths:
      - /web/auth/**
      - /web/search/note/**
      - /web/search/record/**
      - /web/category/getCategoryTreeData/**
      - /uploads/**
      - /web/ws/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /swagger-ui.html
      - /doc.html
spring:
  main:
    web-application-type: reactive
  web:
    resources:
      add-mappings: false
  cloud:
    nacos:
      server-addr: 192.168.56.2:8848 # nacos
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: note
          uri: lb://note-service
          predicates:
            - Path=/web/note/**, /web/category/**, /web/tag/**, /web/album/**
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/web/auth/**, /web/user/**
        - id: interaction
          uri: lb://interaction-service
          predicates:
            - Path=/web/chat/**, /web/comment/**, /web/follow/**, /web/likeOrFavorite/**, /web/ws/**
        - id: oss
          uri: lb://oss-service
          predicates:
            - Path=/web/oss/**
        - id: oss-static # 静态资源访问
          uri: lb://oss-service
          predicates:
            - Path=/uploads/**
        - id: search
          uri: lb://search-service
          predicates:
            - Path=/web/search/**
