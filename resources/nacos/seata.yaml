seata:
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.56.2:8848 # nacos地址
      namespace: "" # namespace，默认为空
      group: DEFAULT_GROUP # 分组，默认是DEFAULT_GROUP
      application: seata-server # seata服务名称
      username: nacos
      password: nacos
  tx-service-group: rednote # 事务组名称
  service:
    vgroup-mapping: # 事务组与tc集群的映射关系
      rednote: "default"