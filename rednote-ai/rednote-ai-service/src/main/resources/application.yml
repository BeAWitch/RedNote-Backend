server:
  port: 8090
  servlet:
    context-path: /

ai:
  provider:
    text: zhipu
    note-optimize: openai

rednote:
  doc:
    group: 'AI 服务'
    package: org.rednote.ai.controller

spring:
  ai:
    zhipuai:
      api-key: ZHIPUAI_API_KEY
    openai:
      api-key: OPENAI_API_KEY
      base-url: OPENAI_BASE_URL
    chat:
      options:
        model: glm-4.7
        temperature: 0.7